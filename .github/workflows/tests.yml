name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Unit rules and seeded playthrough of all 36 kinds
        run: npm test
      - name: Real-browser smoke test (headless Chrome)
        run: CHROME="$(which google-chrome || which google-chrome-stable)" npm run test:browser
      - name: Peer-to-peer multiplayer smoke test (two headless players)
        run: CHROME="$(which google-chrome || which google-chrome-stable)" npm run test:p2p
      - name: Save compatibility (a v0.4.1 save loads in this build)
        run: |
          git fetch --depth=1 origin rollback/v0.4.1:rollback/v0.4.1
          CHROME="$(which google-chrome || which google-chrome-stable)" npm run test:save
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-evidence
          path: production/qa/evidence/*.png
